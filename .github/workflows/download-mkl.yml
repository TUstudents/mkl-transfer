name: Download MKL wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download MKL wheel
        shell: bash
        run: |
          set -euo pipefail
          url="https://files.pythonhosted.org/packages/61/da/4921e17b1f455f7fed30d5cc0964f3289eee6a6cb03cdf7d5e20c14bd025/mkl-2026.1.0-py2.py3-none-manylinux_2_28_x86_64.whl"
          out="mkl-2026.1.0-py2.py3-none-manylinux_2_28_x86_64.whl"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$url" --output "$out"
          sha256sum "$out" | tee SHA256SUMS.txt
          ls -lh "$out" SHA256SUMS.txt

      - name: Upload MKL wheel
        uses: actions/upload-artifact@v4
        with:
          name: mkl-wheel-2026.1.0
          path: |
            mkl-2026.1.0-py2.py3-none-manylinux_2_28_x86_64.whl
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
